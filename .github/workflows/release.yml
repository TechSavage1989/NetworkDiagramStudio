name: Publish approved preview
on:
  push:
    branches: [main]
    paths: ['docs/releases/intent.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-release
          path: dist/release
      - name: Verify intent, merged commit, checksums and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-preview.py
