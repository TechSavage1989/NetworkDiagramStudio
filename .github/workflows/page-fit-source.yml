name: Page-fit source validation bundle
on:
  push:
    branches: [fix/adaptive-port-map-page-fit]
    paths: [.github/workflows/page-fit-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive exact source for isolated local validation
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/NetworkDiagramStudio-source.zip"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TechSavage1989/SwitchPort_Diagram_Builder
          path: reference-builder
          persist-credentials: false
      - name: Archive reference layout implementation
        working-directory: reference-builder
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/SwitchPortDiagramBuilder-reference.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: page-fit-source
          path: |
            ${{ runner.temp }}/NetworkDiagramStudio-source.zip
            ${{ runner.temp }}/SwitchPortDiagramBuilder-reference.zip
          retention-days: 1
          if-no-files-found: error
