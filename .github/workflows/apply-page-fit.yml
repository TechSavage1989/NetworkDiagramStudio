name: Prepare preview.41 candidate
on:
  push:
    branches: [fix/adaptive-port-map-page-fit]
    paths: [.github/workflows/apply-page-fit.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'TechSavage1989/NetworkDiagramStudio'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact reviewed source patch
        shell: python
        run: |
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          parent = subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          if parent != 'd4ef30074f0cb6f3dd75cc46062f4cfa77ded7ce':
              raise RuntimeError('The preparation branch changed; inspect before applying this patch.')
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded))
          if hashlib.sha256(patch).hexdigest() != 'af3b6c6b7ed6e591daa7b0d750cd8711d625777886c93635b55603808e7e6398':
              raise RuntimeError('Patch checksum mismatch.')
          target = Path(os.environ['RUNNER_TEMP'])/'preview41.patch'
          target.write_bytes(patch)
          subprocess.run(['git','config','core.autocrlf','false'],check=True)
          subprocess.run(['git','checkout-index','-a','-f'],check=True)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
      - name: Validate layout and build the offline editor
        shell: pwsh
        run: |
          node scripts/check-repo.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/adaptive-port-map.test.mjs tests/portmap-stack-fit.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/build-web.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Capture the actual fictional editor on Microsoft Edge
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'page-fit-tools'
          npm install --prefix $tools --no-audit --no-fund --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_MODULE_PATH = Join-Path $tools 'node_modules/playwright'
          $env:BROWSER_EXECUTABLE_PATH = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $env:BROWSER_EXECUTABLE_PATH)) { throw 'Microsoft Edge is unavailable.' }
          $env:NDS_QA_OUTPUT = Join-Path $env:RUNNER_TEMP 'page-fit-captures'
          node tests/browser-adaptive-port-map.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item (Join-Path $env:NDS_QA_OUTPUT 'adaptive-8-a4.png') docs/images/port-map.png -Force
      - name: Commit validated source and remove temporary preparation workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-page-fit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git commit -m 'Fix adaptive paper-aware port maps for preview.41'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/fix/adaptive-port-map-page-fit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git rev-parse HEAD
