name: Validate portable builds
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  portable:
    name: Windows and browser validation
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check repository and browser engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/check-repo.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish and verify Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify native switchport report paper media boxes
        shell: pwsh
        run: dotnet run --project tests/report-paper-native/ReportPaperChecks.csproj --configuration Release
      - name: Package portable web and Windows assets
        run: python scripts/package-release.py
      - name: Exercise native window, timers, update and rollback
        shell: pwsh
        run: ./tests/desktop/native-check.ps1 -Binary dist/windows/NetworkDiagramStudio.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
