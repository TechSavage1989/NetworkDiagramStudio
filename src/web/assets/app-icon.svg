<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">NetworkDiagramStudio</title>
  <desc id="description">A network switch connected to three diagram nodes. Flat, independently editable vector shapes.</desc>
  <g id="background" fill="#17364A"><rect x="16" y="16" width="480" height="480" rx="104"/></g>
  <g id="connections" fill="none" stroke="#E9F2F3" stroke-width="18" stroke-linecap="square" stroke-linejoin="round">
    <path id="switch-uplink" d="M256 192V270"/>
    <path id="branch-left" d="M256 270H128V326"/>
    <path id="branch-middle" d="M256 270V326"/>
    <path id="branch-right" d="M256 270H384V326"/>
  </g>
  <g id="switch">
    <rect id="switch-body" x="88" y="88" width="336" height="112" rx="20" fill="#E9F2F3"/>
    <g id="switch-ports" fill="#17364A">
      <rect x="112" y="128" width="32" height="32" rx="3"/>
      <rect x="160" y="128" width="32" height="32" rx="3"/>
      <rect x="208" y="128" width="32" height="32" rx="3"/>
      <rect x="256" y="128" width="32" height="32" rx="3"/>
      <rect x="304" y="128" width="32" height="32" rx="3"/>
    </g>
    <rect id="status-light" x="368" y="132" width="24" height="24" rx="12" fill="#23A696"/>
  </g>
  <g id="diagram-nodes">
    <rect id="node-left" x="80" y="320" width="96" height="96" rx="18" fill="#23A696"/>
    <rect id="node-middle" x="208" y="320" width="96" height="96" rx="18" fill="#EB795F"/>
    <rect id="node-right" x="336" y="320" width="96" height="96" rx="18" fill="#23A696"/>
    <g id="node-details" fill="#17364A">
      <rect x="104" y="344" width="48" height="12" rx="3"/><rect x="104" y="372" width="32" height="12" rx="3"/>
      <rect x="232" y="344" width="48" height="12" rx="3"/><rect x="232" y="372" width="32" height="12" rx="3"/>
      <rect x="360" y="344" width="48" height="12" rx="3"/><rect x="360" y="372" width="32" height="12" rx="3"/>
    </g>
  </g>
</svg>
